name = "thankheaven-chat"
main = "src/worker.js"
compatibility_date = "2024-09-23"

[vars]
SITE_URL            = "https://www.mauisandsseaside.com"
NIGHTLY_RATE_CENTS  = "35000"
CLEANING_FEE_CENTS  = "17500"
TAX_RATE            = "0.1496"

# Set these secrets once via CLI (never commit them):
#   wrangler secret put OPENAI_API_KEY
#   wrangler secret put GOOGLE_SERVICE_ACCOUNT_EMAIL
#   wrangler secret put GOOGLE_PRIVATE_KEY
#   wrangler secret put GOOGLE_CALENDAR_ID
#   wrangler secret put GOOGLE_SHEETS_ID
#   wrangler secret put STRIPE_SECRET_KEY   ← use sk_test_... for test mode
