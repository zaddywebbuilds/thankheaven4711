name: Weekly Keyword Research

on:
  schedule:
    # Every Saturday at 20:00 UTC (10:00 AM HST)
    - cron: "0 20 * * 6"
  workflow_dispatch:  # Allow manual runs

jobs:
  keyword-research:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openai

      - name: Run keyword research
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/keyword_research.py

      - name: Commit updated topics.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/topics.json
          if git diff --cached --quiet; then
            echo "No changes to topics.json -- nothing to commit"
          else
            git commit -m "feat: weekly keyword refresh $(date -u +%Y-%m-%d)"
            git push
          fi
