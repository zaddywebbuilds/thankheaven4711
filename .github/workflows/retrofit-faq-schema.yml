name: Retrofit FAQ Schema

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max posts to process (0 = all remaining)"
        required: false
        default: "0"
      dry_run:
        description: "Dry run -- show what would be done, no file writes"
        type: boolean
        required: false
        default: false

jobs:
  retrofit-faq:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openai

      - name: Run FAQ retrofitter
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/add_faq_schema.py $ARGS

      - name: Commit updated posts
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/*.html blog/.faq_progress.json
          if git diff --cached --quiet; then
            echo "No changes -- all posts already had FAQ schema"
          else
            COUNT=$(git diff --cached --name-only | grep -c '\.html$' || true)
            git commit -m "feat: add FAQ schema to ${COUNT} existing blog posts"
            git push
          fi
